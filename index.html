<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Hidrantes - CBMSC</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c0392b">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hidrantes">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --red:#c0392b;
    --red-dark:#8e2c22;
    --green:#2e8b57;
    --amber:#d68910;
    --gray:#7f8c8d;
    --bg:#f4f4f4;
    --card:#ffffff;
    --text:#222;
    --muted:#666;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;flex-direction:column;height:100%;}

  header{
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    color:#fff;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    z-index:1000;
    flex-wrap:wrap;
  }
  header .logo{
    width:38px;height:38px;border-radius:50%;
    background:#fff;color:var(--red-dark);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  header h1{font-size:15px;margin:0;line-height:1.2;}
  header p{font-size:11px;margin:0;opacity:.9;}
  header .status{
    margin-left:auto;font-size:11px;text-align:right;opacity:.95;
    display:flex;flex-direction:column;gap:2px;
  }
  header button{
    background:#fff;color:var(--red-dark);border:none;border-radius:6px;
    padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:4px;white-space:nowrap;
  }
  header button:active{transform:scale(.97);}
  header button:disabled{opacity:.5;cursor:default;}

  #main{flex:1;position:relative;display:flex;overflow:hidden;}
  #map{flex:1;height:100%;}

  #panel{
    width:340px;max-width:88vw;
    background:var(--card);
    border-left:1px solid #ddd;
    display:flex;flex-direction:column;
    overflow:hidden;
    z-index:900;
  }
  #panel h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin:0;
  }
  #panelToggle{
    width:100%;background:none;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px 4px;font-family:inherit;
  }
  #panelChevron{
    font-size:11px;color:var(--muted);transition:transform .2s;flex-shrink:0;
  }
  #filters{
    display:flex;gap:6px;padding:6px 12px 10px;border-bottom:1px solid #eee;flex-wrap:wrap;
  }
  #filters select{
    flex:1;min-width:110px;font-size:12px;padding:5px 6px;border:1px solid #ccc;border-radius:6px;
    background:#fff;color:var(--text);
  }
  #list{overflow-y:auto;flex:1;}
  .hcard{
    padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer;
    display:flex;gap:10px;align-items:flex-start;
  }
  .hcard:hover{background:#faf3f2;}
  .hcard.active{background:#fdeceb;border-left:3px solid var(--red);}
  .hcard .rank{
    width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;margin-top:2px;
  }
  .hcard .info{flex:1;min-width:0;}
  .hcard .addr{font-size:13px;font-weight:600;line-height:1.3;}
  .hcard .ref{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .hcard .meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap;}
  .dist-badge{
    font-size:11px;font-weight:700;background:#eee;color:#333;padding:2px 6px;border-radius:10px;
  }
  .city-badge{
    font-size:10.5px;font-weight:600;background:#eaf1fb;color:#1a4c8f;padding:2px 6px;border-radius:10px;
  }
  .state-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .state-ok{background:var(--green);}
  .state-warn{background:var(--amber);}
  .state-bad{background:var(--red);}
  .empty-msg{padding:20px 14px;font-size:13px;color:var(--muted);text-align:center;}

  #banner{
    padding:8px 12px;font-size:12px;background:#fff8e1;color:#7a5b00;
    border-bottom:1px solid #f0e0a0;display:none;
  }
  #banner.show{display:block;}

  .leaflet-popup-content{font-size:12.5px;line-height:1.45;max-width:230px;}
  .leaflet-popup-content b{font-size:13.5px;}
  .popup-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:8px;margin:4px 0;color:#fff;}
  .popup-badge.ok{background:var(--green);}
  .popup-badge.warn{background:var(--amber);}
  .popup-badge.bad{background:var(--red);}
  .popup-link{display:inline-block;margin-top:6px;font-size:12px;color:var(--red-dark);font-weight:600;text-decoration:none;}

  /* user marker pulse */
  .user-dot{
    width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;
    box-shadow:0 0 0 rgba(26,115,232,.5);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(26,115,232,.5);}
    70%{box-shadow:0 0 0 14px rgba(26,115,232,0);}
    100%{box-shadow:0 0 0 0 rgba(26,115,232,0);}
  }

  @media (max-width:760px){
    #main{flex-direction:column;}
    #panel{
      width:100%;max-width:100%;max-height:45vh;order:2;
      border-left:none;border-top:1px solid #ddd;
      transition:max-height .25s ease;
    }
    #panel.collapsed{ max-height:44px; overflow:hidden; }
    #panel.collapsed #panelChevron{ transform:rotate(180deg); }
    #map{order:1;}
    header h1{font-size:13.5px;}
    header p{font-size:10px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🚒</div>
    <div>
      <h1>Hidrantes — CBMSC</h1>
      <p id="subtitle">Corpo de Bombeiros Militar de SC · 17º BBM</p>
    </div>
    <div class="status" id="statusBox">Carregando dados…</div>
    <button id="locateBtn" disabled>📍 Minha localização</button>
    <button id="pickBtn" disabled>📌 Marcar no mapa</button>
    <button id="installBtn" style="display:none;">⬇️ Instalar app</button>
  </header>

  <div id="banner"></div>

  <div id="main">
    <div id="map"></div>
    <div id="panel">
      <button id="panelToggle" type="button">
        <h2 id="panelTitle">Hidrantes</h2>
        <span id="panelChevron">▼</span>
      </button>
      <div id="filters">
        <select id="cidadeFilter"><option value="">Todas as cidades</option></select>
        <select id="bairroFilter"><option value="">Todos os bairros</option></select>
      </div>
      <div id="list"><div class="empty-msg">Carregando hidrantes…</div></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =======================================================================
   Fonte de dados: hidrantes.csv (mesmo repositório).
   Para atualizar os hidrantes, edite hidrantes.csv direto pelo GitHub
   (botão "Edit" no arquivo) e faça commit — a página busca a versão mais
   recente automaticamente a cada carregamento.
   ======================================================================= */
const CSV_URL = './hidrantes.csv';

/* ---------- Parser de CSV (suporta campos entre aspas com vírgulas) ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); field = ''; rows.push(row); row = []; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function csvToHydrants(text) {
  const rows = parseCSV(text).filter(r => r.some(c => c && c.trim() !== ''));
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = name => header.indexOf(name);
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const lat = parseFloat(r[idx('lat')]);
    const lng = parseFloat(r[idx('lng')]);
    if (isNaN(lat) || isNaN(lng)) continue;
    out.push({
      cidade: (r[idx('cidade')] || '').trim(),
      bairro: (r[idx('bairro')] || '').trim(),
      endereco: (r[idx('endereco')] || '').trim(),
      lat, lng,
      referencia: (r[idx('referencia')] || '').trim(),
      estado: (r[idx('estado')] || '').trim(),
      vazao: (r[idx('vazao')] || '').trim(),
      alteracoes: (r[idx('alteracoes')] || '').trim(),
      link: (r[idx('link')] || '').trim()
    });
  }
  return out;
}

/* ---------- Utilidades ---------- */
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDist(m){
  if(m < 1000) return Math.round(m) + " m";
  return (m/1000).toFixed(2) + " km";
}
function stateClass(estado){
  if(/não funciona/i.test(estado)) return "bad";
  if(/necessita|reparo|manopla|troca/i.test(estado)) return "warn";
  return "ok";
}

/* ---------- Mapa ---------- */
const map = L.map('map', { zoomControl: true }).setView([-28.9357, -49.4864], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 20,
  subdomains: 'abcd',
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

const hydrantIcon = (cls) => L.divIcon({
  className: '',
  html: `<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
          background:${cls==='bad' ? '#c0392b' : cls==='warn' ? '#d68910' : '#2e8b57'};
          border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;">
          <span style="transform:rotate(45deg);font-size:13px;">🚰</span></div>`,
  iconSize: [26,26],
  iconAnchor: [13,26],
  popupAnchor: [0,-24]
});
const userIcon = L.divIcon({ className:'', html:'<div class="user-dot"></div>', iconSize:[16,16], iconAnchor:[8,8] });

let HIDRANTES = [];
let userMarker = null;
let userLatLng = null;
let pickMode = false;
let filterCidade = '';
let filterBairro = '';

const listEl = document.getElementById('list');
const panelTitle = document.getElementById('panelTitle');
const statusBox = document.getElementById('statusBox');
const banner = document.getElementById('banner');
const cidadeSel = document.getElementById('cidadeFilter');
const bairroSel = document.getElementById('bairroFilter');
const locateBtn = document.getElementById('locateBtn');
const pickBtn = document.getElementById('pickBtn');
const panelEl = document.getElementById('panel');
const panelToggle = document.getElementById('panelToggle');

/* No celular, a lista começa recolhida para não cobrir o mapa/localização;
   o usuário expande tocando no título. No desktop o painel lateral não atrapalha. */
if (window.matchMedia('(max-width: 760px)').matches) {
  panelEl.classList.add('collapsed');
}
panelToggle.addEventListener('click', () => {
  panelEl.classList.toggle('collapsed');
});

function filteredHydrants(){
  return HIDRANTES.filter(h =>
    (!filterCidade || h.cidade === filterCidade) &&
    (!filterBairro || h.bairro === filterBairro)
  );
}

function populateFilters(){
  const cidades = [...new Set(HIDRANTES.map(h => h.cidade).filter(Boolean))].sort();
  cidadeSel.innerHTML = '<option value="">Todas as cidades</option>' +
    cidades.map(c => `<option value="${c}">${c}</option>`).join('');

  const bairros = [...new Set(HIDRANTES.filter(h => !filterCidade || h.cidade === filterCidade)
    .map(h => h.bairro).filter(Boolean))].sort();
  bairroSel.innerHTML = '<option value="">Todos os bairros</option>' +
    bairros.map(b => `<option value="${b}">${b}</option>`).join('');
}

function renderMarkers(){
  HIDRANTES.forEach(h => { if (h._marker) map.removeLayer(h._marker); });
  filteredHydrants().forEach(h => {
    const cls = stateClass(h.estado);
    const marker = L.marker([h.lat, h.lng], { icon: hydrantIcon(cls) }).addTo(map);
    marker.bindPopup(`
      <b>${h.endereco}</b><br>
      <span class="popup-badge ${cls}">${cls==='bad'?'Não funcionando':cls==='warn'?'Necessita reparo':'Em boas condições'}</span><br>
      <b>Cidade/Bairro:</b> ${h.cidade}${h.bairro ? ' — ' + h.bairro : ''}<br>
      <b>Referência:</b> ${h.referencia}<br>
      <b>Situação:</b> ${h.estado}<br>
      ${h.link ? `<a class="popup-link" href="${h.link}" target="_blank" rel="noopener">Abrir no Google Maps ↗</a>` : ''}
    `);
    h._marker = marker;
  });
}

function renderList(){
  let items = filteredHydrants();
  if(userLatLng){
    items = items.map(h => ({...h, dist: haversine(userLatLng.lat, userLatLng.lng, h.lat, h.lng)}));
    items.sort((a,b) => a.dist - b.dist);
    panelTitle.textContent = 'Hidrantes mais próximos de você';
  } else {
    panelTitle.textContent = `Hidrantes (${items.length})`;
  }

  listEl.innerHTML = '';
  if(items.length === 0){
    listEl.innerHTML = '<div class="empty-msg">Nenhum hidrante encontrado para este filtro.</div>';
    return;
  }
  items.forEach((h, rank) => {
    const cls = stateClass(h.estado);
    const card = document.createElement('div');
    card.className = 'hcard';
    card.innerHTML = `
      <div class="rank">${rank+1}</div>
      <div class="info">
        <div class="addr">${h.endereco}</div>
        <div class="ref">${h.referencia}</div>
        <div class="meta">
          <span class="state-dot state-${cls}"></span>
          ${h.dist !== undefined ? `<span class="dist-badge">${fmtDist(h.dist)}</span>` : ''}
          <span class="city-badge">${h.cidade}${h.bairro ? ' · ' + h.bairro : ''}</span>
        </div>
      </div>
    `;
    card.addEventListener('click', () => {
      map.setView([h.lat, h.lng], 17, { animate: true });
      h._marker.openPopup();
      document.querySelectorAll('.hcard').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
    });
    listEl.appendChild(card);
  });
}

function refreshView(){
  renderMarkers();
  renderList();
}

cidadeSel.addEventListener('change', () => {
  filterCidade = cidadeSel.value;
  filterBairro = '';
  populateFilters();
  refreshView();
});
bairroSel.addEventListener('change', () => {
  filterBairro = bairroSel.value;
  refreshView();
});

/* ---------- Geolocalização ---------- */
function setUserLocation(lat, lng, label){
  userLatLng = { lat, lng };
  if(userMarker) map.removeLayer(userMarker);
  userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 })
    .addTo(map).bindPopup(label || 'Você está aqui');
  const pool = filteredHydrants();
  if(pool.length){
    const nearest = pool.map(h => ({...h, dist: haversine(lat, lng, h.lat, h.lng)}))
                         .sort((a,b) => a.dist - b.dist)[0];
    statusBox.innerHTML = `Localização definida<br>Hidrante mais próximo: <b>${fmtDist(nearest.dist)}</b>`;
    const bounds = L.latLngBounds([[lat, lng]]);
    pool.slice(0).sort((a,b) => haversine(lat,lng,a.lat,a.lng) - haversine(lat,lng,b.lat,b.lng))
      .slice(0,5).forEach(h => bounds.extend([h.lat, h.lng]));
    map.fitBounds(bounds, { padding: [60,60], maxZoom: 16 });
  } else {
    statusBox.textContent = 'Localização definida';
  }
  renderList();
}

function togglePickMode(on){
  pickMode = on;
  const mapEl = document.getElementById('map');
  if(on){
    mapEl.style.cursor = 'crosshair';
    banner.textContent = 'Toque/clique no mapa no local onde você está para calcular os hidrantes mais próximos.';
    banner.classList.add('show');
  } else {
    mapEl.style.cursor = '';
  }
}
map.on('click', (e) => {
  if(!pickMode) return;
  setUserLocation(e.latlng.lat, e.latlng.lng, 'Sua localização (definida manualmente)');
  togglePickMode(false);
  banner.classList.remove('show');
});

function locateUser(){
  statusBox.textContent = 'Localizando você…';
  banner.classList.remove('show');

  if(window.isSecureContext === false){
    statusBox.textContent = 'Localização indisponível';
    banner.innerHTML = 'O navegador só permite obter sua localização automática em páginas HTTPS. ' +
      'Use o botão <b>"📌 Marcar no mapa"</b> para indicar onde você está.';
    banner.classList.add('show');
    return;
  }
  if(!navigator.geolocation){
    statusBox.textContent = 'Geolocalização indisponível';
    banner.textContent = 'Seu navegador não suporta geolocalização. Use "📌 Marcar no mapa" ou veja a lista abaixo.';
    banner.classList.add('show');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => setUserLocation(pos.coords.latitude, pos.coords.longitude, 'Você está aqui'),
    (err) => {
      statusBox.textContent = 'Localização não disponível';
      let msg = 'Não foi possível obter sua localização.';
      if(err.code === 1) msg = 'Permissão de localização negada. Habilite-a nas configurações do navegador, ou use "📌 Marcar no mapa".';
      else if(err.code === 2) msg = 'Posição indisponível no momento. Tente novamente ou use "📌 Marcar no mapa".';
      else if(err.code === 3) msg = 'Tempo esgotado. Tente novamente ou use "📌 Marcar no mapa".';
      banner.textContent = msg;
      banner.classList.add('show');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
}

locateBtn.addEventListener('click', locateUser);
pickBtn.addEventListener('click', () => togglePickMode(true));

/* ---------- Carregamento dos dados (CSV do repositório) ---------- */
async function loadData(){
  try {
    const res = await fetch(CSV_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    HIDRANTES = csvToHydrants(text);
    if(HIDRANTES.length === 0) throw new Error('CSV vazio ou em formato inesperado');

    populateFilters();
    refreshView();
    statusBox.textContent = `${HIDRANTES.length} hidrantes carregados`;
    locateBtn.disabled = false;
    pickBtn.disabled = false;
    locateUser();
  } catch (err) {
    statusBox.textContent = 'Erro ao carregar dados';
    banner.innerHTML = 'Não foi possível carregar <b>hidrantes.csv</b>. Verifique se o arquivo está publicado junto com esta página. (' + err.message + ')';
    banner.classList.add('show');
    listEl.innerHTML = '<div class="empty-msg">Não foi possível carregar os hidrantes.</div>';
  }
}
loadData();

/* ---------- PWA: instalação e service worker ---------- */
if ('serviceWorker' in navigator && window.isSecureContext !== false) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}

let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.style.display = 'flex';
});
installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  installBtn.style.display = 'none';
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
});
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});
</script>
</body>
</html>
